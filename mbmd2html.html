<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mbmd → HTML 转换器 · MarkBottom 0.1</title>
<style>
  :root { --bg:#1e1f22; --fg:#e6e6e6; --dim:#9aa0a6; --line:#3a3d42; --acc:#4c9ffe; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 14px/1.7 -apple-system, "Segoe UI", "Noto Sans SC", Meiryo, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
           padding: .5rem .75rem; border-bottom: 1px solid var(--line); }
  header .sp { flex: 1 1 auto; }
  button, label.btn {
      font: inherit; padding: .25rem .7rem; border: 1px solid var(--line); border-radius: .35rem;
      background: #2b2d31; color: var(--fg); cursor: pointer; }
  button:hover, label.btn:hover { background: #35383d; }
  button.on { border-color: var(--acc); color: var(--acc); }
  input[type=file] { display: none; }
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  .pane { flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; }
  .pane + .pane { border-left: 1px solid var(--line); }
  .pane h2 { margin: 0; padding: .3rem .75rem; font-size: .8rem; font-weight: 400;
             color: var(--dim); border-bottom: 1px solid var(--line); }
  textarea { flex: 1 1 auto; width: 100%; resize: none; border: 0; outline: none;
             padding: .75rem; background: #26282c; color: var(--fg);
             font: 13px/1.6 "SF Mono", Consolas, "Noto Sans Mono CJK SC", monospace; }
  iframe { flex: 1 1 auto; width: 100%; border: 0; background: #fff; }
  .srcbox { flex: 1 1 auto; overflow: auto; display: none; }
  .srcbox pre { margin: 0; padding: .75rem; white-space: pre-wrap; word-break: break-all;
                font: 12px/1.6 "SF Mono", Consolas, monospace; color: #cfd3d8; }
  #log { max-height: 7em; overflow: auto; padding: .3rem .75rem; font-size: 12px;
         color: #ffcf7f; border-top: 1px solid var(--line); }
  #log:empty { display: none; }
  .hint { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>

<header>
  <strong>mbmd&nbsp;→&nbsp;HTML</strong>
  <span class="hint" id="ver"></span>
  <label class="btn">打开 .mbmd<input type="file" id="file" accept=".mbmd,.mbmd.md,.md,.txt"></label>
  <button id="demo">载入示例</button>
  <button id="clear">清空</button>
  <span class="sp"></span>
  <button id="viewPreview" class="on">预览</button>
  <button id="viewSource">HTML 源码</button>
  <button id="copy">复制 HTML</button>
  <button id="download">下载 .html</button>
</header>

<main>
  <section class="pane">
    <h2>mbmd 源文件（可直接拖进来）</h2>
    <textarea id="in" spellcheck="false" placeholder="在这里写 mbmd，或把 .mbmd 文件拖进这个窗口……"></textarea>
  </section>
  <section class="pane">
    <h2 id="outTitle">预览</h2>
    <iframe id="out" title="预览"></iframe>
    <div class="srcbox" id="srcbox"><pre id="srccode"></pre></div>
  </section>
</main>

<div id="log"></div>

<!-- ============================================================
     标准 CSS（第 1 节「必要的样式定义」+ 文档基础排版）
     ============================================================ -->
<script type="text/plain" id="stdCss">
/* ===== 1. 必要的样式定义 ===== */
.mb-ruby-under { ruby-position: under; }
.mb-ruby-over  { ruby-position: over; }
.mb-bigger { font-size: 150%; }
.mb-smaller { font-size: 75%; }
.mb-gray { opacity: 0.75; }
.mb-commental { opacity: 0.75; font-size: 75%; }
.mb-commental::before { opacity: 0.75; font-size: 75%; content: "("; }
.mb-commental::after  { opacity: 0.75; font-size: 75%; content: ")"; }
.mb-blacked { color: #444; background-color: #444; }
.mb-blacked:hover { color: #eee; }
.mb-fgcolored { color: var(--mbhighlightcolor, #26d); }
.mb-bgcolored { background-color: var(--mbhighlightbgcolor, #ed6d); }
.mb-bgpartialcolored {
    background-image: linear-gradient(var(--mbhighlightbgcolor, #ed6d), var(--mbhighlightbgcolor, #ed6d));
    background-repeat: no-repeat;
    background-size: 100% 0.5em;
    background-position: 0 calc(100% - 0em);
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
}

/* ===== 1.1 新增语法所需的样式（必需） ===== */
.mb-left   { text-align: left; }
.mb-center { text-align: center; }
.mb-right  { text-align: right; }
.mb-block  { display: block; }
.mb-float-right { float: right; clear: right; margin: 0 0 0.5em 0.5em; }
.mb-float-left  { float: left;  clear: left;  margin: 0 0.5em 0.5em 0; }
.mb-inline-middle { display: inline-block; vertical-align: middle; }

.mb-vertical   { writing-mode: vertical-rl; display: inline-block; vertical-align: top; }
.mb-horizontal { writing-mode: horizontal-tb; }

.mb-origin { white-space: pre-wrap; }

.mb-btn {
    display: inline-block; padding: 0.1em 0.8em; border: 1px solid #aaa;
    border-radius: 0.35em; background: #f4f4f4; color: inherit; font: inherit;
    line-height: 1.6; text-decoration: none; cursor: pointer;
}
.mb-btn:hover  { background: #e9e9e9; }
.mb-btn:active { background: #dedede; }

.mb-input { font: inherit; padding: 0.1em 0.4em; border: 1px solid #aaa;
            border-radius: 0.25em; background: #fff; color: inherit; }

.mb-label { display: inline-flex; align-items: center; gap: 0.3em; cursor: pointer; }

.mb-fold > summary { cursor: pointer; }

.mb-fold-inline { display: inline; }
.mb-fold-inline > .mb-fold-state {
    position: absolute; width: 0; height: 0; margin: 0; opacity: 0; pointer-events: none;
}
.mb-fold-inline > .mb-fold-body,
.mb-fold-inline > .mb-fold-close { display: none; }
.mb-fold-inline > .mb-fold-state:checked ~ .mb-fold-body,
.mb-fold-inline > .mb-fold-state:checked ~ .mb-fold-close { display: inline; }
.mb-fold-inline > .mb-fold-state:checked ~ .mb-fold-title { display: none; }
.mb-fold-title, .mb-fold-close { cursor: pointer; font: inherit; }
.mb-fold-title::before { content: "▶ "; }

.mb-fold-block > .mb-fold-state {
    position: absolute; width: 0; height: 0; margin: 0; opacity: 0; pointer-events: none;
}
.mb-fold-block > .mb-fold-body,
.mb-fold-block > .mb-fold-close { display: none; }
.mb-fold-block > .mb-fold-state:checked ~ .mb-fold-body { display: block; }
.mb-fold-block > .mb-fold-state:checked ~ .mb-fold-close { display: block; }
.mb-fold-block > .mb-fold-state:checked ~ .mb-fold-title { display: none; }

.mb-slash { position: relative; }
.mb-slash::before {
    content: ""; position: absolute; inset: 0; background-size: 100% 100%;
    background-repeat: no-repeat; pointer-events: none;
}
.mb-slash-u::before {
    background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="100" x2="100" y2="0" stroke="%23bbb" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>');
}
.mb-slash-d::before {
    background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100" stroke="%23bbb" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>');
}
.mb-slash > .mb-slash-head,
.mb-slash > .mb-slash-mid,
.mb-slash > .mb-slash-tail {
    position: absolute; font-size: 75%; line-height: 1.2; white-space: nowrap;
}
.mb-slash-fan {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
}
.mb-slash-fan line { stroke: #bbb; stroke-width: 1; vector-effect: non-scaling-stroke; }

.mb-chart { margin: 0.5em 0; }
.mb-chart-bar { display: flex; align-items: flex-end; gap: 0.25em; height: 8em; }
.mb-chart-bar .mb-bar {
    flex: 1 1 0; height: calc(var(--mb-v) / var(--mb-max) * 100%);
    background: var(--mbhighlightbgcolor, #ed6d);
    border-radius: 0.15em 0.15em 0 0; text-align: center; font-size: 75%;
}
.mb-chart-pie { width: 8em; height: 8em; }

/* 折叠块放在表格里时，被折叠的行 */
tr[hidden] { display: none; }
[data-mb-fold][hidden] { display: none; }
/* ↑ 但表格里【不要】真的把行 display:none 掉：被隐藏的行不再占位，跨行的 rowspan 就会
   把后面的行整片挤歪（表看起来散架）。表格里的折叠一律用 .mb-fold-off：
   行留在表格里（rowspan 永远有效），只把那一行的内容与内边距收掉。 */
/* 列表项 / 普通块：被折叠就直接藏起来 */
[data-mb-fold].mb-fold-off:not(tr) { display: none; }
tr.mb-fold-off > th, tr.mb-fold-off > td {
    visibility: hidden; font-size: 0; line-height: 0;
    padding: 0; border: 0; height: 0;
}
tr.mb-fold-off > th > *, tr.mb-fold-off > td > * { display: none; }

/* ===== 媒体（图片 / 视频 / 音频） ===== */
.mb-media, .mb-media-cover > img { max-width: 100%; }
.mb-media-cover { display: inline-block; }
.mb-media-cover > img { display: block; margin-bottom: 0.3em; }
body.mb-doc video, body.mb-doc audio { max-width: 100%; }

/* ===== 文档基础排版 ===== */
body.mb-doc {
    margin: 0 auto; padding: 2rem 1.25rem 4rem; max-width: 48rem;
    background: #fff; color: #24292f;
    font: 16px/1.8 -apple-system, "Segoe UI", "Noto Sans SC", Meiryo, sans-serif;
    word-wrap: break-word;
}
body.mb-doc h1, body.mb-doc h2, body.mb-doc h3,
body.mb-doc h4, body.mb-doc h5, body.mb-doc h6 { line-height: 1.35; margin: 1.6em 0 .6em; }
body.mb-doc h1 { font-size: 1.9em; border-bottom: 1px solid #e5e5e5; padding-bottom: .25em; }
body.mb-doc h2 { font-size: 1.5em; border-bottom: 1px solid #eee; padding-bottom: .2em; }
body.mb-doc h3 { font-size: 1.25em; }
body.mb-doc a { color: #0969da; }
body.mb-doc blockquote { margin: 1em 0; padding: .1em 1em; color: #57606a;
                         border-left: .25em solid #d0d7de; }
body.mb-doc hr { height: 1px; border: 0; background: #d8dee4; margin: 2em 0; }
body.mb-doc code { font-family: "SF Mono", Consolas, "Noto Sans Mono CJK SC", monospace;
                   font-size: .9em; background: #f2f3f5; padding: .15em .35em; border-radius: .25em; }
body.mb-doc pre { background: #f6f8fa; padding: .75em 1em; border-radius: .375em; overflow: auto; }
body.mb-doc pre code { background: none; padding: 0; }
body.mb-doc table { border-collapse: collapse; margin: 1em 0;
                    /* 表格宽过屏幕时能左右滑动 */
                    display: block; overflow-x: auto; max-width: 100%; }
body.mb-doc th, body.mb-doc td { border: 1px solid #d0d7de; padding: .35em .6em; vertical-align: top; }
body.mb-doc thead th, body.mb-doc th[scope=row] { background: #f2f3f5; }
body.mb-doc img { max-width: 100%; }
body.mb-doc dl { margin: 1em 0; }
body.mb-doc dt { font-weight: 600; }
body.mb-doc dd { margin: 0 0 .4em 1.5em; }
body.mb-doc .mb-footnotes { margin-top: 3em; padding-top: .75em; border-top: 1px solid #e5e5e5;
                            font-size: .9em; color: #57606a; }
body.mb-doc .mb-exec:empty { display: none; }
body.mb-doc .mb-exec:empty + br { display: none; }
</script>

<script type="text/plain" id="stdJs">
/* mb.js —— MarkBottom 0.1 参考运行时 */
(function () {
  'use strict';
  var GLOBAL = Object.create(null);
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    var d = new Date();
    GLOBAL.timeh = pad(d.getHours());
    GLOBAL.timem = pad(d.getMinutes());
    GLOBAL.times = pad(d.getSeconds());
    GLOBAL.timeY = String(d.getFullYear());
    GLOBAL.timeM = pad(d.getMonth() + 1);
    GLOBAL.timeD = pad(d.getDate());
  }
  tick();
  GLOBAL.browser = navigator.userAgent;
  GLOBAL.os = navigator.platform ||
    (navigator.userAgentData ? navigator.userAgentData.platform : '');

  var TOKEN_RE = new RegExp(
    '\\s*(' +
      '\\d+(?:\\.\\d+)?' +
      '|"(?:[^"\\\\]|\\\\.)*"' +
      '|\\$[A-Za-z_][A-Za-z0-9_]*\\$' +
      '|\\+:|\\-:|%:|>:' +
      '|\\+\\+|--|\\+=|-=|\\*=|\/=' +
      '|>=|<=|==|!=' +
      '|\\.-|\\.\\+|\\.\\?' +
      '|[+\\-*/%()\\[\\],=!|&<>?:]' +
    ')', 'y');

  function tokenize(src) {
    var out = [], i = 0, m;
    while (i < src.length) {
      if (/\s/.test(src[i])) { i++; continue; }
      TOKEN_RE.lastIndex = i;
      m = TOKEN_RE.exec(src);
      if (!m) throw new SyntaxError('非法字符：' + src[i]);
      out.push(m[1]);
      i = TOKEN_RE.lastIndex;
    }
    return out;
  }
  function truthy(v) {
    return !(v === '' || v === 0 || v === '0' || v === false || v === null || v === undefined);
  }
  function evaluate(src, scope) {
    var toks = tokenize(src), p = 0;
    var peek = function () { return toks[p]; };
    var eat = function (t) { if (toks[p] === t) { p++; return true; } return false; };
    var expect = function (t) { if (!eat(t)) throw new SyntaxError('期望 “' + t + '”'); };
    var getVar = function (n) {
      if (n === 'cntnt') return scope.cntnt === undefined ? '' : scope.cntnt;
      if (n in scope) return scope[n];
      if (n in GLOBAL) return GLOBAL[n];
      return '';
    };
    var setVar = function (n, v) { if (n === 'cntnt') scope.cntnt = v; else scope[n] = v; return v; };
    function conditional() {
      var c = assignment();
      if (eat('?')) { var a = conditional(); expect(':'); var b = conditional(); return truthy(c) ? a : b; }
      return c;
    }
    function assignment() {
      var t = peek();
      if (t && t.charAt(0) === '$') {
        var name = t.slice(1, -1), op = toks[p + 1];
        if (op === '=' || op === '+=' || op === '-=' || op === '*=' || op === '/=') {
          p += 2;
          var old = getVar(name), rhs = assignment();
          if (op === '=')  return setVar(name, rhs);
          if (op === '+=') return setVar(name, Number(old) + Number(rhs));
          if (op === '-=') return setVar(name, Number(old) - Number(rhs));
          if (op === '*=') return setVar(name, Number(old) * Number(rhs));
          return setVar(name, Number(old) / Number(rhs));
        }
        if (op === '++' || op === '--') {
          p += 2; var v0 = Number(getVar(name));
          setVar(name, op === '++' ? v0 + 1 : v0 - 1); return v0;
        }
      }
      return or();
    }
    function or()  { var v = and(); while (eat('|')) { var r = and(); v = truthy(v) || truthy(r); } return v; }
    function and() { var v = equ(); while (eat('&')) { var r = equ(); v = truthy(v) && truthy(r); } return v; }
    function equ() {
      var v = rel();
      for (;;) { if (eat('==')) v = (v == rel()); else if (eat('!=')) v = (v != rel()); else return v; }
    }
    function rel() {
      var v = strOps();
      for (;;) {
        if (eat('>=')) v = (v >= strOps());
        else if (eat('<=')) v = (v <= strOps());
        else if (eat('>')) v = (v > strOps());
        else if (eat('<')) v = (v < strOps());
        else return v;
      }
    }
    function strOps() {
      var v = add();
      for (;;) {
        if (eat('+:')) { v = String(v) + String(add()); }
        else if (eat('-:')) { v = String(v).split(String(add())).join(''); }
        else if (eat('%:')) {
          var oldS = add();
          if (!eat('>:')) throw new SyntaxError('“%:” 必须与 “>:” 配对');
          v = String(v).split(String(oldS)).join(String(add()));
        } else return v;
      }
    }
    function add() {
      var v = mul();
      for (;;) {
        if (eat('+')) v = Number(v) + Number(mul());
        else if (eat('-')) v = Number(v) - Number(mul());
        else return v;
      }
    }
    function mul() {
      var v = unary();
      for (;;) {
        if (eat('*')) v = Number(v) * Number(unary());
        else if (eat('/')) v = Number(v) / Number(unary());
        else if (eat('%')) v = Number(v) % Number(unary());
        else return v;
      }
    }
    function unary() {
      if (eat('!')) return !truthy(unary());
      if (eat('-')) return -Number(unary());
      if (eat('+')) return Number(unary());
      return postfix();
    }
    function postfix() {
      var v = primary();
      for (;;) {
        if (eat('[')) { var n = conditional(); expect(']'); v = String(v).charAt(Number(n) - 1); }
        else if (eat('.-')) v = Math.floor(Number(v));
        else if (eat('.+')) v = Math.ceil(Number(v));
        else if (eat('.?')) v = Math.round(Number(v));
        else return v;
      }
    }
    function primary() {
      var t = peek();
      if (t === undefined) throw new SyntaxError('表达式意外结束');
      if (/^\d/.test(t)) { p++; return parseFloat(t); }
      if (t.charAt(0) === '"') { p++; return JSON.parse(t); }
      if (t.charAt(0) === '$') { p++; return getVar(t.slice(1, -1)); }
      if (eat('(')) { var v = conditional(); expect(')'); return v; }
      throw new SyntaxError('无法解析：“' + t + '”');
    }
    var value = conditional();
    if (p !== toks.length) throw new SyntaxError('表达式未完全解析');
    return value;
  }

  function splitCalls(inner) {
    var calls = [], i = 0;
    while (i < inner.length) {
      if (inner.charAt(i) !== '{') { i++; continue; }
      var depth = 1, j = i + 1, inStr = false;
      while (j < inner.length && depth > 0) {
        var c = inner.charAt(j);
        if (inStr) { if (c === '\\') j++; else if (c === '"') inStr = false; }
        else if (c === '"') inStr = true;
        else if (c === '{') depth++;
        else if (c === '}') depth--;
        j++;
      }
      calls.push(inner.slice(i + 1, j - 1));
      i = j;
    }
    return calls;
  }

  // 文档级共享的变量：赋值语句（{`$a=1`}）写下的变量，别的语句、触发器都能用
  var DOC_SCOPE = Object.create(null);
  // trigger 记下来的“后面那串功能语句”：flag → { units: [...], anchor: 元素 }
  var TRIGGERS = Object.create(null);
  // call / use 比 trigger 先跑到时，先在这里排队，等页面加载完再补跑
  var PENDING = [];
  // 运行时做过的动作（转换器会把这份日志抓去显示，方便排查）
  var MB_LOG = [];
  function LOG(s) {
    MB_LOG.push(s);
    if (window.console && console.info) console.info('[mb] ' + s);
  }

  /* ---- 行内重解析：put / rplc 插进去的文本要当成 mb 文本再解析一遍 ----
     只做行内语法，而且【不】再执行 {{…}} / {$…$} / {`…`} 这类功能语句（免得重复执行）。 */
  var MB_ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
  function mbEsc(s) { return String(s).replace(/[&<>"]/g, function (c) { return MB_ESC[c]; }); }
  function rubyLite(inner) {
    var bar = -1, slash = -1, depth = 0, j;
    for (j = 0; j < inner.length; j++) {
      var cc = inner[j];
      if (cc === '【') { depth++; continue; }
      if (cc === '】') { depth--; continue; }
      if (depth > 0) continue;
      if ((cc === '|' || cc === '｜') && bar < 0 && slash < 0) bar = j;
      else if ((cc === '/' || cc === '／') && slash < 0 && bar < 0) slash = j;
    }
    var i0 = bar >= 0 ? bar : slash, up = '', down = '';
    if (i0 < 0) return '<ruby>' + mbEsc(inner) + '</ruby>';
    var base = inner.slice(0, i0), after = inner.slice(i0 + 1);
    if (bar >= 0) {
      var s2 = after.indexOf('/');
      if (s2 < 0) s2 = after.indexOf('／');
      if (s2 >= 0) { up = after.slice(0, s2); down = after.slice(s2 + 1); } else up = after;
    } else down = after;
    var markU = '<rp>(</rp><rt>' + mbEsc(up) + '</rt><rp>)</rp>';
    var markD = '<rp>(</rp><rt>' + mbEsc(down) + '</rt><rp>)</rp>';
    if (up && down) {
      return '<ruby class="mb-ruby-under"><ruby class="mb-ruby-over">' + mbEsc(base) + markU
           + '</ruby>' + markD + '</ruby>';
    }
    if (down) return '<ruby class="mb-ruby-under">' + mbEsc(base) + markD + '</ruby>';
    return '<ruby>' + mbEsc(base) + markU + '</ruby>';
  }
  function mbInline(s) {
    var out = '', i = 0, n = s.length;
    function plain(ch) { out += mbEsc(ch); }
    while (i < n) {
      var c = s[i], e, t = null;
      if (c === '\\') {
        var nx = s[i + 1];
        if (nx === 'o' && s[i + 2] !== undefined) { plain(s[i + 2]); i += 3; continue; }
        if (nx === undefined) { plain('\\'); i++; continue; }
        var named = { n: '<br>', t: '\t', '<': '&lt;', '>': '&gt;', '&': '&amp;', '\\': '\\' };
        out += (named[nx] !== undefined ? named[nx] : mbEsc(nx));

    if (cm) { box = '<input type="checkbox" disabled' + (cm[1] !== ' ' ? ' checked' : '') + '> '; first = cm[2]; }
    var rest = content.slice(1);
    var lsc = { attrs: [] };          // 列表项末尾的命名语句 / aria-label 作用于这个 <li>
    var inner = inline(first, lsc);
    h += '<li' + (it.fid ? ' data-mb-fold="' + esc(it.fid) + '" hidden' : '')
       + lsc.attrs.join('') + '>' + box + inner;
    if (rest.length) {
      var sub = parseBlocks(rest);
      h += (sub.indexOf('<p>') === 0 ? '' : '\n') + sub;
    }
    h += '</li>\n';
  });
  return { html: h + '</' + tag + '>\n', next: i };
}

/* ==================================================================
   6. 编译入口
   ================================================================== */
var footnotes = [];
function compile(src) {
  warnings = []; footnotes = [];
  tickClock();
  var lines = src.replace(/\r\n?/g, '\n').split('\n');
  collectFoldIds(src);
  // 折叠块的写法检查：给出明确的报错提示，而不是悄悄把表格切断
  lines.forEach(function (ln) {
    var head = RE_FOLD_HEAD.exec(ln);
    if (head && !FOLD_IDS[head[1].trim()]) {
      warn('发现折叠内容区 `[' + head[1].trim() + ']~>[`，但没有找到对应的按钮 `~[标题]~>['
         + head[1].trim() + ']`——两处的标识符必须完全一样');
    }
    var noTilde = /\[([^\]\n]+?)\]\s*[~～]\s*[>＞]\s*\[([^\]\n]+?)\]/.exec(ln);
    if (noTilde) {
      var before = ln.charAt(noTilde.index - 1);
      if (before !== '~' && before !== '～' && !FOLD_IDS[noTilde[2].trim()]) {
        warn('`' + noTilde[0] + '` 看起来像折叠按钮，但少了开头的 `~`——按钮写成 `~[标题]~>[标识符]`，'
           + '`~` 不能省略，现在这里按普通文本输出');
      }
    }
    /* 命名语句要写在元素【后面】（见标准 3.1）。写在前面是旧写法，提示一下 */
    if (/^\s*\{[#.][^}]*\}\s*\S/.test(ln)) {
      warn('命名语句写在了元素前面：应写成「元素 {#id}」（见 3.1）——`' + ln.trim().slice(0, 24)
         + '` 现在仍按旧写法作用到本块上');
    }
  });
  // 首行版本/语言声明
  if (lines.length && /^\s*\{\{v:[^}]*\}/.test(lines[0])) lines.shift();
  var html = parseBlocks(lines);
  if (footnotes.length) {
    html += '\n<section class="mb-footnotes">\n<ol>\n' + footnotes.map(function (f) {
      return '<li id="fn-' + esc(f.key) + '">' + inline(f.text) + '</li>';
    }).join('\n') + '\n</ol>\n</section>\n';
  }
  return html;
}
function fullHtml(body, title) {
  return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n'
       + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
       + '<title>' + esc(title || 'MarkBottom 文档') + '</title>\n<style>\n'
       + document.getElementById('stdCss').textContent.trim() + '\n</style>\n'
       + '</head>\n<body class="mb-doc">\n' + body
       + '\n<script>\n' + document.getElementById('stdJs').textContent.trim() + '\n<\/script>\n'
       + '</body>\n</html>\n';
}

/* 这一版的标记：换了新文件后，标题栏右边会显示它——用来确认你跑的不是旧文件 */
var BUILD = 'build 2026-09-27i';
var $ = function (id) { return document.getElementById(id); };
var input = $('in'), out = $('out'), srcbox = $('srcbox'), srccode = $('srccode'), log = $('log');
var lastHtml = '';
$('ver').textContent = BUILD;

function render() {
  var src = input.value;
  var body, err = null;
  try { body = compile(src); } catch (e) { err = e; body = '<pre>' + esc(String(e.stack || e)) + '</pre>'; }
  var tm = /^#\s+(.+)$/m.exec(src);
  lastHtml = fullHtml(body, tm ? tm[1].replace(/\s*\{[#.][^}]*\}\s*$/, '') : undefined);
  var compileLog = [BUILD].concat(err ? ['解析出错：' + err.message]
    : warnings.map(function (w) { return '⚠ ' + w; }));
  log.textContent = compileLog.join('\n');
  // 预览加载完，再把“运行时实际做过什么”也显示到日志区（put / trigger / call / use / rplc）
  out.onload = function () {
    var w2 = out.contentWindow, m = w2 && w2.mb;
    var lines = compileLog.slice();
    if (m && m.log && m.log.length) {
      lines = lines.concat(m.log.map(function (s) { return '· ' + s; }));
    } else if (/{{/.test(src)) {
      lines.push('（运行时没有报告任何动作——说明页面里的运行时没跑起来：'
                 + '多半是转换器还是旧文件，请确认标题栏的 build 版本）');
    }
    log.textContent = lines.join('\n');
  };
  out.srcdoc = lastHtml;
  srccode.textContent = lastHtml;
  localStorage.setItem('mbmd.src', src);
}

var timer = null;
input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(render, 220); });

$('file').addEventListener('change', function (e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () { input.value = r.result; render(); };
  r.readAsText(f, 'utf-8');
  e.target.value = '';
});
document.addEventListener('dragover', function (e) { e.preventDefault(); });
document.addEventListener('drop', function (e) {
  e.preventDefault();
  var f = e.dataTransfer.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () { input.value = r.result; render(); };
  r.readAsText(f, 'utf-8');
});
$('demo').addEventListener('click', function () { input.value = SAMPLE; render(); });
$('clear').addEventListener('click', function () { input.value = ''; render(); });
$('viewPreview').addEventListener('click', function () {
  out.style.display = 'block'; srcbox.style.display = 'none';
  this.classList.add('on'); $('viewSource').classList.remove('on');
  $('outTitle').textContent = '预览';
});
$('viewSource').addEventListener('click', function () {
  out.style.display = 'none'; srcbox.style.display = 'block';
  this.classList.add('on'); $('viewPreview').classList.remove('on');
  $('outTitle').textContent = 'HTML 源码（生成的完整文件）';
});
$('copy').addEventListener('click', function () {
  navigator.clipboard.writeText(lastHtml).then(function () {
    var b = $('copy'), old = b.textContent;
    b.textContent = '已复制 ✓'; setTimeout(function () { b.textContent = old; }, 1200);
  });
});
$('download').addEventListener('click', function () {
  var blob = new Blob([lastHtml], { type: 'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mbmd.html';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
});

input.value = localStorage.getItem('mbmd.src') || SAMPLE;
render();
